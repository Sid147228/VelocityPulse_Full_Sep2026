<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VelocityPulse</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='20260923-live1') }}">
</head>
<body>
  {% include "_header.html" %}
  <main class="content">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="vp-notice {% if category == 'error' %}vp-error{% endif %}" role="status">{{ message }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
